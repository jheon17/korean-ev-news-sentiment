[project]
name = "ev-news-sentiment"
version = "0.1.0"
description = "국내 전기차 뉴스의 시장 영향을 긍정·중립·부정으로 분류하는 학습 프로젝트"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.52.0",
]

[project.optional-dependencies]
local-models = [
    "sentencepiece==0.2.2",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[tool.uv]
package = false
